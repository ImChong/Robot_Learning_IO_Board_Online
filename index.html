<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover：刘海屏横屏时页面铺到边，安全区由 CSS 的 env() 让出。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#222222" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Robot Learning IO Board Online · 机器人学习输入输出分析板</title>
    <meta
      name="description"
      content="用模块与连线展示热门人形机器人强化学习项目的观测输入、动作输出与奖励函数。覆盖 SONIC 与 BeyondMimic，可在训练态与部署态之间切换。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232d74da'/%3E%3Cg stroke='%23fff' fill='%23fff'%3E%3Cpath d='M9 10H15M9 22H15M15 10V22M15 16H23' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='9' cy='10' r='2.6' stroke='none'/%3E%3Ccircle cx='9' cy='22' r='2.6' stroke='none'/%3E%3Ccircle cx='23' cy='16' r='2.6' stroke='none'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="assets/style.css" />
    <!-- KaTeX 本地自带（vendor/katex，MIT）：不走 CDN，页面在离线与受限网络下也能正确排公式。 -->
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <script src="assets/theme-init.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#canvas">跳到节点图</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="site-title" href="./" aria-label="Robot Learning IO Board Online · 机器人学习输入输出分析板 首页">
          <svg class="site-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="7" fill="currentColor" />
            <g stroke="#fff" fill="#fff">
              <path
                d="M9 10H15M9 22H15M15 10V22M15 16H23"
                stroke-width="2.2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="9" cy="10" r="2.6" stroke="none" />
              <circle cx="9" cy="22" r="2.6" stroke="none" />
              <circle cx="23" cy="16" r="2.6" stroke="none" />
            </g>
          </svg>
          <span class="site-title-text">
            <strong
              >Robot Learning IO Board Online<span class="site-title-zh"> | 机器人学习输入输出分析板</span></strong
            >
            <small>人形机器人强化学习的输入 · 输出 · 奖励函数</small>
          </span>
        </a>

        <div class="project-picker">
          <button
            class="picker-trigger"
            id="picker-trigger"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            title="切换项目（快捷键 P，[ ] 上下一个）"
          >
            <span class="picker-current" id="picker-current"></span>
            <span class="picker-caret" aria-hidden="true">▾</span>
          </button>

          <div class="picker-panel" id="picker-panel" hidden>
            <input
              class="picker-search"
              id="picker-search"
              type="search"
              role="combobox"
              autocomplete="off"
              aria-controls="picker-list"
              aria-expanded="false"
              placeholder="搜索项目、机器人、算法、机构…"
              aria-label="搜索项目"
            />
            <div class="picker-list" id="picker-list" role="listbox" aria-label="项目列表"></div>
            <p class="picker-empty" id="picker-empty" hidden>没有匹配的项目</p>
          </div>
        </div>

        <div class="header-right">
          <a
            class="github-link"
            href="https://github.com/ImChong/Robot_Learning_IO_Board_Online"
            target="_blank"
            rel="noopener"
            title="源码仓库"
            aria-label="源码仓库（GitHub）"
          >
            <svg class="github-mark" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.68-.01-1.34-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
              />
            </svg>
            <span class="github-label">GitHub</span>
          </a>
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            title="切换主题"
            aria-label="切换主题"
          >
            <span aria-hidden="true">◐</span>
          </button>
        </div>
      </div>
    </header>

    <div class="load-bar" id="load-bar" hidden aria-hidden="true"><span></span></div>

    <section class="project-head" id="project-head"></section>

    <div class="toolbar">
      <div class="mode-switch" id="mode-switch" role="tablist" aria-label="训练态与部署态"></div>
      <div class="mode-switch" id="view-switch" role="tablist" aria-label="展示形式"></div>

      <div class="toolbar-right">
        <div class="filters" id="filters"></div>
        <button
          class="icon-btn"
          id="tour-btn"
          type="button"
          aria-pressed="false"
          title="按代码运行顺序逐个模块讲解（快捷键 G）"
        >
          ▶ 讲解
        </button>
        <button class="icon-btn" id="fit-btn" type="button" title="缩放到合适大小">适应窗口</button>
        <button class="icon-btn" id="legend-btn" type="button" aria-expanded="false">图例</button>
      </div>
    </div>

    <p class="mode-summary" id="mode-summary"></p>

    <div class="legend" id="legend" hidden></div>

    <main class="stage">
      <div class="canvas" id="canvas" tabindex="0" aria-label="模块与连线节点图">
        <div class="viewport" id="viewport">
          <svg class="edges" id="edges" aria-hidden="true"></svg>
          <div class="nodes" id="nodes"></div>
        </div>
        <div class="canvas-hint" id="canvas-hint">滚轮缩放 · 拖拽平移 · 点击模块看详情</div>

        <div class="canvas-zoom" role="group" aria-label="画布缩放">
          <button class="cz-btn" id="zoom-in" type="button" title="放大" aria-label="放大">＋</button>
          <button class="cz-btn" id="zoom-out" type="button" title="缩小" aria-label="缩小">－</button>
          <button class="cz-btn" id="zoom-fit" type="button" title="适应窗口" aria-label="适应窗口">
            ⤢
          </button>
        </div>
      </div>

      <!-- 讲解面板与详情抽屉占同一列：两块内容都在说「当前这个模块」，
           同时出现只会互相抢注意力，窄屏上更是两个浮层叠在一起。 -->
      <aside class="tour" id="tour" hidden aria-live="polite" aria-label="逐模块讲解"></aside>

      <aside class="drawer" id="drawer" aria-live="polite">
        <div class="drawer-empty" id="drawer-empty">
          <h2>模块详情</h2>
          <p>点击左侧任意模块，这里会显示它的维度构成、真机如何获得、以及出处链接。</p>
          <p class="hint">
            键盘：<kbd>P</kbd> 打开项目列表，<kbd>[</kbd>/<kbd>]</kbd> 上下一个项目，<kbd>T</kbd>/<kbd>D</kbd>
            切训练与部署，<kbd>G</kbd> 按运行顺序讲解，<kbd>F</kbd> 适应窗口，<kbd>Esc</kbd> 关闭详情。
          </p>
        </div>
        <div class="drawer-body" id="drawer-body" hidden></div>
      </aside>
    </main>

    <section class="callouts" id="callouts"></section>

    <section class="rewards" id="rewards"></section>

    <section class="compare" id="compare" hidden></section>

    <section class="table-view" id="table-view" hidden></section>

    <footer class="site-footer" id="footer"></footer>

    <script defer src="vendor/katex/katex.min.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
